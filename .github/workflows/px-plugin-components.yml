name: Strinova plugin components
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.99.1'
          target: wasm32-wasip2
          cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-patch-crate
          key: patch-crate-0.1.13-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: strinova-plugins-v065
          cache-workspace-crates: 'true'
      - uses: go-task/setup-task@v2
        with:
          version: '3.52.0'
      - run: task prepare:crates
      - name: Test request policies and identity parsing
        run: cargo test --locked --release -p strinova-model-mapping -p stravia-vendor-sdk -p stravia-vendor-common --lib
      - name: Build independently installable components
        run: cargo build --locked --release --lib --target wasm32-wasip2 -p strinova-model-mapping -p stravia-vendor-codex -p stravia-vendor-claudecode -p stravia-vendor-antigravity
      - name: Checksum components
        run: |
          mkdir plugins
          cp target/wasm32-wasip2/release/{strinova_model_mapping,stravia_vendor_codex,stravia_vendor_claudecode,stravia_vendor_antigravity}.wasm plugins/
          cd plugins
          sha256sum *.wasm > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: strinova-plugins-${{ github.sha }}
          path: plugins/*
          retention-days: 30
