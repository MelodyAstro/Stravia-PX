name: Strinova CI retention

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  workflow_run:
    workflows: [Strinova Native Linux, Strinova source preparation, Strinova plugin components, Strinova native release]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: strinova-ci-retention
  cancel-in-progress: false

jobs:
  prune:
    if: github.event.repository.fork == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Always use the default branch, never executable code from a triggering PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test px/ops/ci-retention.test.mjs
      - run: node px/ops/ci-retention.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_APPLY: 'true'
